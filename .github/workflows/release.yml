# SPDX-License-Identifier: AGPL-3.0-or-later
# Publicación de versiones: imágenes en GHCR, SBOM CycloneDX, firmas Cosign y paquete offline
# verificable sin Internet (Modalidad A, sección 15.1). Decisiones D-11 y D-48.
#
# Clave de firma: secreto COSIGN_SIGNING_KEY_PEM (clave EC P-256 en PEM, generada y custodiada
# por el responsable del proyecto). Si el secreto no existe, se firma con una CLAVE EFÍMERA DE
# PRUEBA: sirve para demostrar el mecanismo, NO para confiar en los artefactos.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Variables de versión
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "api=ghcr.io/$OWNER/auditor-21719-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/$OWNER/auditor-21719-web" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen API
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: api
          push: true
          tags: ${{ steps.v.outputs.api }}:${{ steps.v.outputs.version }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          provenance: mode=max

      - name: Construir y publicar imagen web
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: web
          push: true
          tags: ${{ steps.v.outputs.web }}:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          provenance: mode=max

      - name: SBOM CycloneDX de la imagen API
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.v.outputs.api }}@${{ steps.api.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-api.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM CycloneDX de la imagen web
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.v.outputs.web }}@${{ steps.web.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-web.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Preparar clave de firma
        id: key
        env:
          SIGNING_KEY_PEM: ${{ secrets.COSIGN_SIGNING_KEY_PEM }}
        run: |
          umask 077
          if [ -n "$SIGNING_KEY_PEM" ]; then
            printf '%s\n' "$SIGNING_KEY_PEM" > key.pem
            echo "kind=proyecto" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sin COSIGN_SIGNING_KEY_PEM: se usa una clave EFÍMERA DE PRUEBA. No confíe en estas firmas."
            openssl ecparam -genkey -name prime256v1 -noout | openssl pkcs8 -topk8 -nocrypt -out key.pem
            echo "kind=efimera-de-prueba" >> "$GITHUB_OUTPUT"
          fi
          # Contraseña aleatoria solo para el formato cifrado de cosign; vive lo que dura el job.
          PASS="$(openssl rand -hex 32)"
          echo "::add-mask::$PASS"
          echo "COSIGN_PASSWORD=$PASS" >> "$GITHUB_ENV"
          COSIGN_PASSWORD="$PASS" cosign import-key-pair --key key.pem --output-key-prefix release --yes
          rm -f key.pem

      - name: Firmar imágenes y adjuntar SBOM como atestación
        run: |
          for ref in "${{ steps.v.outputs.api }}@${{ steps.api.outputs.digest }}" "${{ steps.v.outputs.web }}@${{ steps.web.outputs.digest }}"; do
            cosign sign --yes --key release.key "$ref"
          done
          cosign attest --yes --key release.key --type cyclonedx --predicate sbom-api.cdx.json "${{ steps.v.outputs.api }}@${{ steps.api.outputs.digest }}"
          cosign attest --yes --key release.key --type cyclonedx --predicate sbom-web.cdx.json "${{ steps.v.outputs.web }}@${{ steps.web.outputs.digest }}"

      - name: Verificar firmas de imágenes con la clave pública
        run: |
          cosign verify --key release.pub "${{ steps.v.outputs.api }}@${{ steps.api.outputs.digest }}" > /dev/null
          cosign verify --key release.pub "${{ steps.v.outputs.web }}@${{ steps.web.outputs.digest }}" > /dev/null
          echo "Firmas de imágenes verificadas."

      - name: Construir paquete offline (Modalidad A)
        id: pkg
        run: |
          V="${{ steps.v.outputs.version }}"
          NAME="auditor-21719-${V}-offline"
          mkdir -p "$NAME/images" "$NAME/deploy" "$NAME/scripts" "$NAME/docs"
          docker pull -q "${{ steps.v.outputs.api }}@${{ steps.api.outputs.digest }}"
          docker pull -q "${{ steps.v.outputs.web }}@${{ steps.web.outputs.digest }}"
          docker pull -q postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
          docker pull -q valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
          docker tag "${{ steps.v.outputs.api }}@${{ steps.api.outputs.digest }}" auditor-21719-api:local
          docker tag "${{ steps.v.outputs.web }}@${{ steps.web.outputs.digest }}" auditor-21719-web:local
          # Se etiquetan por nombre (no solo digest) para que conserven su nombre al cargarse sin red.
          docker tag "postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5" postgres:18-alpine
          docker tag "valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507" valkey/valkey:8-alpine
          docker save -o "$NAME/images/imagenes.tar" auditor-21719-api:local auditor-21719-web:local postgres:18-alpine valkey/valkey:8-alpine
          cp -r deploy/compose deploy/docker "$NAME/deploy/"
          rm -f "$NAME"/deploy/compose/secrets/postgres_password "$NAME"/deploy/compose/secrets/valkey.conf
          cp scripts/generate-secrets.sh scripts/smoke-compose.sh "$NAME/scripts/"
          cp -r docs/fase-1 "$NAME/docs/" 2>/dev/null || true
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md "$NAME/"
          tar -czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.tar.gz" sbom-api.cdx.json sbom-web.cdx.json > SHA256SUMS
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: PT-01 (parcial) — instalar desde el paquete offline sin descargar imágenes
        run: |
          NAME="${{ steps.pkg.outputs.name }}"
          rm -rf prueba-offline && mkdir prueba-offline && tar -xzf "$NAME.tar.gz" -C prueba-offline
          docker image rm -f auditor-21719-api:local auditor-21719-web:local postgres:18-alpine valkey/valkey:8-alpine >/dev/null 2>&1 || true
          docker load -i "prueba-offline/$NAME/images/imagenes.tar"
          cd "prueba-offline/$NAME"
          sh scripts/generate-secrets.sh
          docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.offline.yaml up -d --wait --wait-timeout 180
          curl -fsS http://127.0.0.1:8080/api/v1/about | grep -q "\"commit\":\"${{ github.sha }}\""
          docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.offline.yaml down -v
          echo "Instalación desde paquete offline correcta (sin descargas de imágenes)."

      - name: Firmar SHA256SUMS
        run: cosign sign-blob --yes --key release.key --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: PT-02 — verificación SIN RED de la firma y de los hashes
        run: |
          COSIGN="$(command -v cosign)"
          # unshare --net crea un espacio de red vacío: cualquier intento de conexión falla.
          sudo unshare --net -- "$COSIGN" verify-blob --key release.pub --bundle SHA256SUMS.sigstore.json --insecure-ignore-tlog SHA256SUMS
          sudo unshare --net -- sha256sum -c SHA256SUMS
          # Contraprueba: un SHA256SUMS alterado debe fallar.
          cp SHA256SUMS alterado && echo "0000  intruso" >> alterado
          if sudo unshare --net -- "$COSIGN" verify-blob --key release.pub --bundle SHA256SUMS.sigstore.json --insecure-ignore-tlog alterado; then
            echo "ERROR: se aceptó un archivo alterado" >&2; exit 1
          fi
          echo "Verificación offline correcta y alteración detectada."

      - name: Publicar versión
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: ${{ steps.v.outputs.prerelease }}
          body: |
            Versión ${{ steps.v.outputs.version }} (commit ${{ github.sha }}).

            **Tipo de clave de firma: ${{ steps.key.outputs.kind }}.**
            ${{ steps.key.outputs.kind == 'efimera-de-prueba' && '⚠️ Firmada con una clave efímera de prueba: demuestra el mecanismo, pero NO garantiza el origen. No instale esta versión en producción.' || 'Verifique con la clave pública del proyecto publicada en deploy/keys/.' }}

            Imágenes:
            - `${{ steps.v.outputs.api }}@${{ steps.api.outputs.digest }}`
            - `${{ steps.v.outputs.web }}@${{ steps.web.outputs.digest }}`

            Verificación: ver `docs/fase-1/verificacion-de-integridad.md`.
          files: |
            ${{ steps.pkg.outputs.name }}.tar.gz
            SHA256SUMS
            SHA256SUMS.sigstore.json
            release.pub
            sbom-api.cdx.json
            sbom-web.cdx.json
