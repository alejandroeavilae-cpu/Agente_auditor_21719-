# SPDX-License-Identifier: AGPL-3.0-or-later
# Perfil local (Modalidad A, Fase 1). Uso: ver docs/fase-1/ejecucion-local.md
#
# Principios aplicados:
#  - Solo el servicio "web" publica un puerto, y únicamente en 127.0.0.1.
#  - Base de datos y caché viven en una red interna sin salida a Internet.
#  - Secretos por archivo montado (/run/secrets), nunca en variables visibles.
#  - Contenedores sin privilegios adicionales y con sistema de archivos de solo lectura cuando es posible.
name: auditor-21719

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  web:
    <<: *hardening
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: web
    image: auditor-21719-web:local
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    networks: [edge, backend]
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *hardening
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: api
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-desarrollo}
        BUILD_VERSION: ${BUILD_VERSION:-0.1.0}
    image: auditor-21719-api:local
    # La API que atiende HTTP NO recibe credenciales de aprovisionamiento (hallazgo QA A-02):
    # usa la cuenta auditor_api, que solo puede LEER el registro de organizaciones, y la
    # clave maestra para abrir las credenciales de cada organización (D-80).
    environment:
      DB_ENGINE: postgresql
      DB_HOST: postgres
      DB_API_USER: auditor_api
      DB_API_PASSWORD_FILE: /run/secrets/api_db_password
      DB_CONTROL_DATABASE: auditor_control
      DB_TLS: disable
      MASTER_KEY_FILE: /run/secrets/master.key
      MASTER_KEY_CHECK_PERMISSIONS: "false"
      # Perfil local sin HTTPS (solo 127.0.0.1): la cookie no puede ser "Secure". El perfil
      # institucional con TLS (2C/11) usa el valor por defecto, true.
      COOKIE_SECURE: "false"
      # Caddy es el único salto delante de la API.
      TRUST_PROXY: "true"
    secrets: [api_db_password, master.key]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # CLI de administración (auditor-admin). No queda corriendo: se usa bajo demanda con
  #   docker compose -f deploy/compose/compose.yaml run --rm admin <comando>
  # Es el ÚNICO servicio que monta la contraseña de aprovisionamiento y la clave maestra.
  admin:
    <<: *hardening
    image: auditor-21719-api:local
    pull_policy: never
    profiles: [tools]
    restart: "no"
    entrypoint: ["node", "dist/admin/cli.js"]
    command: ["--help"]
    environment:
      DB_ENGINE: postgresql
      DB_HOST: postgres
      # Cuenta SIN superusuario (CREATEDB, CREATEROLE), creada por postgres-init.
      DB_ADMIN_USER: auditor_provisioner
      DB_ADMIN_PASSWORD_FILE: /run/secrets/provisioner_password
      DB_CONTROL_DATABASE: auditor_control
      # `init` concede a esta cuenta la lectura del registro de organizaciones (D-80).
      DB_API_READER_USER: auditor_api
      # Red interna aislada (sin salida a Internet): TLS se habilita en el perfil institucional (Fase 2C/11).
      DB_TLS: disable
      MASTER_KEY_FILE: /run/secrets/master.key
      # Ver loadMasterKey: la protección del archivo está en el directorio del anfitrión.
      MASTER_KEY_CHECK_PERMISSIONS: "false"
    secrets: [provisioner_password, master.key]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    <<: *hardening
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      # Superusuario del motor: solo lo usa el propio contenedor de PostgreSQL. La plataforma
      # usa auditor_provisioner (sin superusuario) y un usuario propio por organización.
      POSTGRES_USER: auditor
      # "postgres" evita crear una base extra con acceso público; la base de control la crea
      # `auditor-admin init` con la cuenta de aprovisionamiento.
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, provisioner_password, api_db_password]
    # El entrypoint oficial arranca como root para preparar el directorio de datos y luego
    # cambia al usuario "postgres": se eliminan todas las capacidades salvo las mínimas
    # para ese cambio de usuario y de propietario de archivos (hallazgo QA H-10).
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditor -d postgres"]
      interval: 10s
      timeout: 3s
      retries: 10

  valkey:
    <<: *hardening
    image: valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    # Se ejecuta directamente con el usuario sin privilegios de la imagen: con
    # cap_drop ALL el entrypoint no puede cambiar de usuario por sí mismo.
    user: valkey
    command: ["valkey-server", "/run/secrets/valkey.conf"]
    secrets: [valkey.conf]
    read_only: true
    volumes:
      - valkey-data:/data
    cap_drop: [ALL]
    networks: [backend]
    healthcheck:
      # La contraseña va por variable de entorno del proceso de chequeo, no por argumentos
      # visibles con "ps" (hallazgo QA H-19).
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(sed -n 's/^requirepass //p' /run/secrets/valkey.conf)\" valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  edge: {}
  backend:
    # Red interna: los contenedores no tienen salida a Internet (D-30, sin telemetría).
    internal: true

volumes:
  postgres-data: {}
  valkey-data: {}

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  valkey.conf:
    file: ./secrets/valkey.conf
  provisioner_password:
    file: ./secrets/provisioner_password
  api_db_password:
    file: ./secrets/api_db_password
  master.key:
    file: ./secrets/master.key
